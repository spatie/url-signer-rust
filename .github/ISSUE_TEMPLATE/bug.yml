name: Bug report
description: Report a reproducible problem with the crate
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the expected behavior and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How can we reproduce the bug?
      description: Include a minimal Rust example and relevant Cargo features.
      render: rust
    validations:
      required: true
  - type: input
    id: package-version
    attributes:
      label: Crate version or Git revision
    validations:
      required: true
  - type: textarea
    id: rust-version
    attributes:
      label: Rust version
      description: Paste the output of rustc --version --verbose.
      render: text
    validations:
      required: true
  - type: dropdown
    id: operating-systems
    attributes:
      label: Affected operating systems
      multiple: true
      options:
        - Linux
        - macOS
        - Windows
  - type: textarea
    id: notes
    attributes:
      label: Additional context
