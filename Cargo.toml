[package]
name = "spatie-url-signer"
version = "1.0.0"
edition = "2024"
rust-version = "1.89"
authors = ["Freek Van der Herten <freek@spatie.be>"]
description = "Create signed URLs with a limited lifetime"
license = "MIT"
repository = "https://github.com/spatie/url-signer-rust"
documentation = "https://docs.rs/spatie-url-signer"
readme = "README.md"
keywords = ["spatie", "url", "signature", "hmac", "security"]
categories = ["web-programming", "authentication"]
include = ["/src/", "/tests/", "/build.rs", "/docs/", "/README.md", "/LICENSE.md", "/CHANGELOG.md", "/CONTRIBUTING.md", "/SECURITY.md", "/Cargo.lock"]

[dependencies]
hmac = "0.12"
sha2 = "0.10"
md-5 = "0.10"
subtle = "2.6"
url = "2.5"
percent-encoding = "2.3"
thiserror = "2"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"

[profile.release]
lto = "thin"
strip = true
